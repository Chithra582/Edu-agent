name: "api-cost-budget-calculator"
description: "Calculates estimated token usage and API costs for agent exercises across providers."
input_schema:
  type: "object"
  properties:
    prompt_tokens_per_turn:
      type: "integer"
      description: "Average prompt tokens per conversational turn."
    turns_count:
      type: "integer"
      description: "Expected total number of agent interaction turns."
    model_provider:
      type: "string"
      description: "Target model backend e.g. openai_gpt4o, claude_sonnet, local_ollama."
  required:
    - "prompt_tokens_per_turn"
    - "turns_count"
